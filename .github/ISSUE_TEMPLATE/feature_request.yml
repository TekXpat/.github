name: Feature request
description: Suggest a change or something new. Start with the problem.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who is affected, what they're trying to do, and what gets in the way. Leave out the solution for now. A clear problem often has a better answer than the first one that comes to mind.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Your idea for solving it, if you have one.
    validations:
      required: false
